<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华自助终端管理平台</title><style>:root{font-family:Inter,"PingFang SC",sans-serif;color:#1b2535;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#243147;color:#cdd4df;padding:26px 18px}.logo{color:white;font-size:19px;font-weight:700}.logo small{display:block;color:#8290a5;font-size:11px}.nav{margin-top:36px}.nav div{padding:11px 13px;border-radius:7px;margin:4px}.nav .on{background:#4169b2;color:white}main{padding:28px 34px}.top{display:flex;justify-content:space-between}.top h1{font-size:24px;margin:0}.muted{font-size:13px;color:#7b8596}.button{background:#4169b2;color:#fff;border:0;border-radius:7px;padding:9px 14px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:24px 0}.card{background:white;border:1px solid #e1e5eb;border-radius:9px;padding:18px}.metric b{display:block;font-size:27px;margin-top:7px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}h2{font-size:16px;margin:0 0 13px}.terminal{display:grid;grid-template-columns:2fr 1.3fr 1fr .7fr;gap:10px;padding:14px 0;border-top:1px solid #edf0f3}.online{color:#207a58}.incident{padding:13px 0;border-top:1px solid #edf0f3}.severity{font-size:11px;color:#ad4a39;background:#fcebe7;border-radius:12px;padding:4px 8px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}main{padding:20px}}</style></head><body><div class="layout"><aside><div class="logo">知华自助终端<small>KIOSK OPERATIONS</small></div><div class="nav"><div class="on">终端总览</div><div>安全策略</div><div>应用版本</div><div>灰度发布</div><div>远程运维</div><div>外设健康</div><div>事件与审计</div></div></aside><main><div class="top"><div><h1>自助终端运营中心</h1><div class="muted">终端安全、应用发布、外设健康与远程运维</div></div><button class="button">注册终端</button></div><div class="stats" id="stats"></div><div class="grid"><section class="card"><h2>终端状态</h2><div id="terminals"></div></section><section class="card"><h2>需要关注</h2><div id="incidents"></div></section></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const n={terminals:'终端总数',online:'在线终端',incidents:'活动事件',deployments:'发布任务',pendingCommands:'待审批命令'};stats.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="card metric"><span class="muted">${n[k]}</span><b>${v}</b></div>`).join('');terminals.innerHTML=d.terminals.map(x=>`<div class="terminal"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.code)}</div></div><span>${esc(x.site)}</span><span>${esc(x.appVersion||'待安装')}</span><span class="online">${esc(x.status)}</span></div>`).join('');incidents.innerHTML=d.incidents.map(x=>`<div class="incident"><span class="severity">${esc(x.severity)}</span><b> ${esc(x.source)}</b><div>${esc(x.summary)}</div><span class="muted">${esc(x.openedAt)}</span></div>`).join('')})</script></body></html>
