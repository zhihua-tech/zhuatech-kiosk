<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业访客自助服务</title><style>body{margin:0;font-family:Inter,"PingFang SC",sans-serif;background:#eef2f6;color:#17233b}.screen{min-height:100vh;display:grid;grid-template-rows:76px 1fr 54px}.head,.foot{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 44px;border-bottom:1px solid #dfe4eb}.brand{font-size:21px;font-weight:700}.time{color:#627087}.main{display:grid;place-items:center}.panel{width:min(980px,88vw)}h1{text-align:center;font-size:38px;margin:0 0 10px}.desc{text-align:center;color:#657286;margin-bottom:36px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.action{background:#fff;border:1px solid #dce2ea;border-radius:14px;padding:30px 24px;min-height:170px;box-shadow:0 8px 22px #17233b0b}.action i{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:#e8eef9;color:#3e68b2;font-style:normal;font-size:21px}.action b{display:block;font-size:20px;margin:18px 0 7px}.action span{color:#6e7a8d}.status{color:#247855}@media(max-width:700px){.actions{grid-template-columns:1fr}.head,.foot{padding:0 20px}}</style></head><body><div class="screen"><header class="head"><div class="brand">知华科技 · 企业访客服务</div><div class="time" id="time"></div></header><main class="main"><section class="panel"><h1>您好，请选择需要办理的业务</h1><div class="desc">自助登记信息仅用于本次来访，办理完成后请取走您的证件和凭条</div><div class="actions"><div class="action"><i>访</i><b>访客预约登记</b><span>已有预约或现场联系被访人</span></div><div class="action"><i>证</i><b>证件与凭条</b><span>扫描有效证件并打印访客凭条</span></div><div class="action"><i>助</i><b>现场服务</b><span>路线指引、企业信息和人工协助</span></div></div></section></main><footer class="foot"><span>上海如静知华信息科技有限公司</span><span class="status">● 设备与外设运行正常</span></footer></div><script>setInterval(()=>time.textContent=new Date().toLocaleString('zh-CN'),1000)</script></body></html>
